name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sandbox-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-11-arm, expect_supported: true }
          # Canary: Windows Server 2025 lacks PSEC (September 2026). Kept so a
          # green run signals that Server support has arrived.
          - { os: windows-2025, expect_supported: false }

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.expect_supported }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Windows version
        run: |
          $v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($v.ProductName) $($v.DisplayVersion) build $($v.CurrentBuild).$($v.UBR) ($([Runtime.InteropServices.RuntimeInformation]::OSArchitecture))"
          "processmodel.dll present: $(Test-Path "$env:windir\System32\processmodel.dll")"

      - name: Install MXC and check sandbox support
        run: ./scripts/check-windows.ps1 -Install -KeepLog

      - name: Show and collect check log
        if: always()
        run: |
          New-Item -ItemType Directory -Force check-log | Out-Null
          Get-ChildItem "$env:TEMP\cordon-check-*\cordon-check.log" | ForEach-Object {
            Get-Content $_.FullName
            Copy-Item $_.FullName check-log\
          }

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cordon-check-${{ matrix.os }}
          path: check-log
          if-no-files-found: ignore

  crystal-build:
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm has PSEC, so Cordon::Mxc's enforcement specs run
        # there; Crystal runs under x64 emulation.
        os: [windows-2025, windows-11-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install MXC
        if: matrix.os == 'windows-11-arm'
        run: ./scripts/check-windows.ps1 -Install

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.20"

      - name: Show Crystal target
        run: crystal --version

      - name: Install shards
        run: shards install

      - name: Build
        run: shards build --debug

      # Builds the spec runner explicitly instead of `crystal spec`, which
      # deletes its temporary executable afterwards and can fail with "Access
      # is denied" while Windows still holds the freshly run file.
      - name: Run tests
        shell: bash
        run: |
          shopt -s globstar
          crystal build spec/**/*_spec.cr -o spec-runner.exe
          ./spec-runner.exe

  # Statically linked: the executable needs only DLLs that ship with Windows,
  # so it runs without Crystal's runtime DLLs or the Visual C++ Redistributable.
  package:
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.20"

      - name: Build release
        shell: bash
        run: |
          mkdir -p bin/release
          SHARDS_BIN_PATH=bin/release shards --production build --release --static

      - name: List build output
        run: Get-ChildItem bin/release | Format-Table Name, Length

      - name: Smoke test
        run: bin/release/cordon.exe version

      - name: Set up MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: List DLL dependencies
        run: dumpbin /nologo /dependents bin\release\cordon.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: cordon-windows-x64
          path: bin/release/

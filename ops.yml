dependencies:
  brew:
    - crystal
  custom:
    - shards check || shards install
    - mkdir -p bin && cp lib/ameba/bin/ameba.cr bin
    - crystal build -o bin/ameba bin/ameba.cr
hooks:
  before:
    - mkdir -p bin/release bin/debug
actions:
  build-release:
    command: SHARDS_BIN_PATH=bin/release shards --production build --release
    description: Build for release
    alias: br
  build-debug:
    command: SHARDS_BIN_PATH=bin/debug shards build --debug
    description: Build for development (debugging)
    aliases: [build, bd]
  run:
    command: crystal run
    description: Compile and run the source file
  clean:
    command: rm -rf bin/debug/* && rm -rf bin/release/*
    description: Clear prior builds
  wipe:
    command: crystal clear_cache && ops clean
    description: Clear build caches and prior builds
  lint:
    command: bin/ameba src/
    description: Run Crystal source linter (ameba)
  test_specs:
    command: crystal spec
    description: Run test specs
  test:
    command: ops test_specs && ops build && ops lint
    description: Run tests and linter
  install:
    description: Build a release and copy it into the '$INSTALL_DIR' folder with version appended.
    command: |
      BRANCH=$(git branch --show-current)
      [ "$BRANCH" == "main" ] || echo 1>&2 "ops: WARNING: not on 'main' branch."

      VERSION=$(grep -E '^version:' shard.yml | awk '{print $2}')
      if [ -e "$INSTALL_DIR" ]; then
        ops build-release && cp bin/release/$APP "$INSTALL_DIR/$APP-${VERSION}"
      else
        echo 1>&2 "ops: The directory '$INSTALL_DIR' does not exist."
      fi
  install-debug:
    description: Build a debug version of Enkaidu and copy it into the '$INSTALL_DIR' folder with version appended.
    command: |
      BRANCH=$(git branch --show-current)
      [ "$BRANCH" == "main" ] || echo 1>&2 "ops: WARNING: not on 'main' branch."

      VERSION=$(grep -E '^version:' shard.yml | awk '{print $2}')
      if [ -e "$INSTALL_DIR" ]; then
        ops build-debug
        cp bin/debug/$APP "$INSTALL_DIR/$APP-dbg-${VERSION}"
        cp bin/debug/$APP.dwarf "$INSTALL_DIR/$APP-dbg-${VERSION}.dwarf"
      else
        echo 1>&2 "ops: The directory '$INSTALL_DIR' does not exist."
      fi
options:
  environment:
    APP: cordon
    INSTALL_DIR: "$HOME/bin"
